services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-task-queue
    ports:
      - "15672:15672"
      - "5671:5671"
      - "5672:5672"
    hostname: "m31"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
