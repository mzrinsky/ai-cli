# This runs a docker container containing an MCP server that exposes a chroma client.
# In a distributed setup you will need to change the host below

# If you need a chroma server..
# docker/chromadb-server.yaml can be run with docker compose,
# to start a chroma server in it's own docker container.
command: docker
args:
  - run
  - --rm
  - -i
  - mcp/chroma
env:
  - CHROMA_CLIENT_TYPE=http
  - CHROMA_HOST=localhost
  - CHROMA_PORT=8000
  - CHROMA_DOTENV_PATH=.chroma_env
transport: stdio
